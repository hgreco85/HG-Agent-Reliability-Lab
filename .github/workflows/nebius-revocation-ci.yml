name: Nebius revocation offline tests
on:
  pull_request:
    paths:
      - 'nebius_revocation.py'
      - 'test_nebius_revocation.py'
      - '.github/workflows/nebius-revocation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (no secrets, no API calls)
        run: |
          python3 -m unittest test_nebius_revocation.py -v
          python3 nebius_revocation.py
